  m1p: Fișiere DBC, Latin-1, structuri care se schimbă de la an la an — gestionate în interiorul pachetului, ca nimeni după tine să nu mai fie nevoit s-o facă.
  m2p: Mai multe ipoteze nule clasice din criminalistica electorală nu sunt valabile pentru numărul de voturi. Pachetul măsoară rata de eroare pe care o obține efectiv pe datele tale.
  m3p: 'Lucrările sunt generate, nu tastate: figurile, tabelele și numerele din text ies toate din aceeași rulare reproductibilă.'
  m4p: Hărți termice în terminal fără bibliotecă grafică; clienți API fără HTTP.jl. Se încarcă repede și sunt ușor de întreținut.
