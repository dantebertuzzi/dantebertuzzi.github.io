ro:
  title: Dante Bertuzzi — statistică, Julia, date publice
  a_lang: Limbă
  a_theme: Temă de culori
  t_auto: auto
  t_paper: hârtie
  t_night: noapte
  a_desert: 'Apus de soare peste sertão: platouri cu vârful plat, râul São Francisco și cactuși mandacaru'
  k1: Portofoliu
  k2: Document de lucru nr. 1
  k3: Noiembrie 2026
  dek: Statistician. Scriu pachete Julia care fac reproductibile datele publice din Brazilia — și studiez clima locului în care trăiesc.
  abs_l: Rezumat
  abs: 'Datele publice din Brazilia sunt bogate și greu de accesat: fișiere DBC comprimate, codificări Latin-1, structuri care se schimbă de la o versiune la alta. Munca mea rezolvă această dezordine o singură dată, în pachete Julia open-source, astfel încât analiza să poată începe de la întrebare, nu de la formatul fișierului. Până acum, zece pachete acoperă registre de sănătate, alegeri, statistici despre criminalitate, banca centrală, biodiversitatea oceanică, calitatea datelor, șabloane de documente și managementul proiectelor. Fac și cercetare reproductibilă: cel mai recent preprint al meu estimează că un an la fel de secetos ca 2012/13, care odinioară era de așteptat cam o dată la 38 de ani în Petrolina, vine acum cam o dată la 12.'
  kw: 'Cuvinte-cheie: statistică · Julia · date publice · reproductibilitate · semiarid'
  fig_title: Precipitații pe an hidrologic, Petrolina, 1963/64–2020/21
  fig_desc: Bare pentru 47 de ani cu date valide. Precipitațiile scad cu aproximativ 60 mm pe deceniu. Cei mai secetoși ani sunt 2011/12, 2012/13 și 2016/17, toți în jur de 150 mm.
  fig_norm: normala 1963–2009 · 549 mm
  fig_trend: tendință -60 mm / deceniu
  nodata: zile valide insuficiente
  fig_l: "<b>Figura 1</b>"
  fig_c: 'Precipitații pe an hidrologic la stația INMET 82983, Petrolina, 1963/64–2020/21 (47 de ani cu date valide; cercurile goale marchează anii fără date). Linie întreruptă: norma oficială 1963–2009. Linie continuă: o tendință Sen–Theil ajustată aici pe aceeași serie, −60 mm pe deceniu; lucrarea raportează −60 [−87; −33]. <span class="pull">Un an secetos e zgomot. Șase decenii de ani secetoși sunt o tendință.</span>'
  s1h: Pachete
  s1l: 'Julia open-source, scris ca să fie citit: scheme tipizate, puține dependențe, Tables.jl oriunde se potrivește.'
  tbl_l: "<b>Tabelul 1</b>"
  tbl_c: Activitatea reprezintă numărul de commit-uri pe săptămână din ultimele 52 de săptămâni, de pe GitHub. Selectează antetul unei coloane pentru a sorta.
  th_pkg: Pachet
  th_dom: Domeniu
  th_ver: Versiune
  th_act: Activitate, 52 săpt.
  th_lnk: Linkuri
  d_microsus: Microdate DATASUS, cu citire în flux a fișierelor .dbc/.dbf la memorie constantă și scheme tipizate pentru SIM, SINASC, SIH, SIA, CNES și SINAN.
  d_brelections: Date electorale TSE — candidați, voturi pe secție de votare, averi, electorat — fără arhive ZIP de dezarhivat și fără Latin-1 de gestionat.
  d_electionforensics: Teste Rozenas, Benford și ale ultimei cifre, care își măsoară propria eroare de tip I pe datele tale înainte să tragi vreo concluzie.
  d_debrief: Statistici despre criminalitate de la MJSP/Sinesp într-o singură schemă stabilă, în ciuda anilor de structuri schimbătoare, cu rate la 100.000 de locuitori.
  d_bcb: 'API-urile Băncii Centrale a Braziliei: serii SGS, cursuri de schimb PTAX, așteptări Focus și un constructor generic de interogări OData.'
  d_obisclient: Un client independent pentru OBIS, Ocean Biodiversity Information System (IOC/UNESCO).
  d_missingpatterns: 'Tipare de date lipsă în terminal: hărți termice, rezumate în stilul md.pattern() și co-apariții, fără nicio dependență grafică.'
  d_perth: Gantt și Kanban controlate din REPL, cu o interfață web locală și partajare în timp real în rețeaua locală.
  d_kanon: Un limbaj de șabloane de documente ale cărui șabloane își declară singure contractul de date.
