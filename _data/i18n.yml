  d_bcb: 'A Brazil Központi Bank API-jai: SGS-idősorok, PTAX-árfolyamok, Focus-várakozások és egy általános OData-lekérdezésépítő.'
  d_obisclient: Független kliens az OBIS-hoz, az Ocean Biodiversity Information Systemhez (IOC/UNESCO).
  d_missingpatterns: 'Hiányzóadat-mintázatok a terminálban: hőtérképek, md.pattern()-stílusú összegzések és együttes előfordulások, ábrázolási függőségek nélkül.'
  d_perth: Gantt és Kanban a REPL-ből vezérelve, helyi webes felülettel és valós idejű megosztással a helyi hálózaton.
  d_kanon: Dokumentumsablon-nyelv, amelynek sablonjai maguk deklarálják az adatszerződésüket.
  d_liquid: A Liquid sablonnyelv tisztán Juliában; a renderelés soha nem futtat Julia-kódot.
