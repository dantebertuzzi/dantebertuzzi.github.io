en:
  a_lang: Language
  a_theme: Colour theme
  t_auto: auto
  t_paper: paper
  t_night: night
  a_desert: 'Sunset over the sertão: flat-topped hills, the São Francisco river and mandacaru cacti'
  k1: Portfolio
  k2: Working paper no. 1
  k3: November 2026
  dek: Statistician. I write Julia packages that make Brazilian public data reproducible — and I study the climate of the place I live.
  abs_l: Abstract
  abs: 'Public data in Brazil is rich and hard to reach: compressed DBC files, Latin-1 encodings, layouts that change between releases. My work absorbs that mess once, in open-source Julia packages, so the analysis can start at the question instead of at the file format. Ten packages so far cover health records, elections, crime statistics, the central bank, ocean biodiversity, data quality, document templating and project management. I also write reproducible research: my latest preprint estimates that a year as dry as 2012/13, once expected about every 38 years in Petrolina, now comes about every 12.'
  kw: 'Keywords: statistics · Julia · public data · reproducibility · semi-arid'
  fig_title: Rainfall per hydrological year, Petrolina, 1963/64 to 2020/21
  fig_desc: Bars for 47 years with valid data. Rainfall falls by about 60 mm per decade. The driest years are 2011/12, 2012/13 and 2016/17, all near 150 mm.
  fig_norm: normal 1963–2009 · 549 mm
  fig_trend: trend -60 mm / decade
  fig_l: "<b>Figure 1</b>"
  fig_c: 'Rainfall per hydrological year at INMET station 82983, Petrolina, 1963/64–2020/21 (47 years with valid data; hollow dots mark years without). Dashed: the 1963–2009 official normal. Solid: a Sen–Theil trend fitted here to the same series, −60 mm per decade; the paper reports −60 [−87; −33]. <span class="pull">One dry year is noise. Six decades of them are a trend.</span>'
  s1h: Packages
  s1l: 'Open-source Julia, written to be read: typed schemas, few dependencies, Tables.jl everywhere it fits.'
  tbl_l: "<b>Table 1</b>"
  tbl_c: Activity is commits per week over the last 52 weeks, from GitHub. Select a column header to sort.
  th_pkg: Package
  th_dom: Domain
  th_ver: Version
  th_act: Activity, 52 wk
  th_lnk: Links
  d_microsus: DATASUS microdata with constant-memory streaming reads of .dbc/.dbf and typed schemas for SIM, SINASC, SIH, SIA, CNES and SINAN.
  dom_health: Health
  l_code: code
  l_docs: docs
  d_brelections: TSE electoral data — candidates, votes by polling station, assets, electorate — with no ZIPs to unpack and no Latin-1 to deal with.
  dom_elections: Elections
  d_electionforensics: Rozenas, Benford and last-digit tests that measure their own type I error on your data before you conclude anything.
  d_debrief: Crime statistics from MJSP/Sinesp under one stable schema across years of shifting layouts, with per-100k rates.
  dom_public_safety: Public safety
  d_bcb: 'Central Bank of Brazil APIs: SGS series, PTAX exchange rates, Focus expectations and a generic OData query builder.'
  dom_economics: Economics
  d_obisclient: An independent client for OBIS, the Ocean Biodiversity Information System (IOC/UNESCO).
  dom_biodiversity: Biodiversity
  d_missingpatterns: 'Missing-data patterns in the terminal: heatmaps, md.pattern()-style summaries and co-occurrence, zero plotting dependencies.'
  dom_data_quality: Data quality
  d_perth: Gantt and Kanban driven from the REPL, with a local web UI and real-time sharing over the LAN.
  dom_tools: Tools
  d_kanon: A document template language whose templates declare their own data contract.
  d_liquid: The Liquid template language in pure Julia; rendering never evaluates Julia code.
  s2h: Research
  s2l: Every number in the text is generated by the code, with unit tests and an independent check in Python.
  cite_code: code &amp; data
  u1: mm / decade
  st1: Annual rainfall trend up to 2020/21, 95% interval −87 to −33.
  u2: "°C / decade"
  st2: Minimum temperature. Maximum rose +0.28 °C per decade.
  u3: years
  st3: Return period of a year as dry as 2012/13, stationary climate vs. recent mean.
  u4: stations
  st4: Regional frequency analysis, cross-checked with ANA rain gauges and INMET normals.
  s3h: Methods
  s3l: How I work, in four rules.
  m1h: <span class="mono">3.1</span>Absorb the mess once
  m1p: DBC files, Latin-1, layouts that drift between years — handled inside the package, so nobody downstream has to.
  m2h: <span class="mono">3.2</span>Check the null before trusting it
  m2p: Several classical election-forensics nulls do not hold for vote counts. The package measures the error rate it actually delivers on your data.
  m3h: <span class="mono">3.3</span>Every number comes from code
  m3p: 'Papers are generated, not typed: figures, tables and the numbers in the prose all come out of the same reproducible run.'
  m4h: <span class="mono">3.4</span>Few dependencies, small surface
  m4p: Terminal heatmaps with no plotting library; API clients without HTTP.jl. Fast to load, easy to keep alive.
  s4h: Correspondence
  s4p: Issues, pull requests and questions about any package are welcome there.
  foot: Set in JetBrains Mono · no trackers · <a href="https://github.com/dantebertuzzi/dantebertuzzi.github.io">source</a>
  title: Dante Bertuzzi — statistics, Julia, public data
  nodata: not enough valid days
it:
  title: Dante Bertuzzi — statistica, Julia, dati pubblici
  a_lang: Lingua
  a_theme: Tema di colore
  t_auto: auto
  t_paper: carta
  t_night: notte
  a_desert: 'Tramonto sul sertão: altipiani dalla cima piatta, il fiume São Francisco e cactus mandacaru'
  k1: Portfolio
  k2: Documento di lavoro n. 1
  k3: Novembre 2026
  dek: Statistico. Scrivo pacchetti Julia che rendono riproducibili i dati pubblici brasiliani — e studio il clima del luogo in cui vivo.
  abs_l: Sommario
  abs: 'I dati pubblici in Brasile sono ricchi e difficili da raggiungere: file DBC compressi, codifiche Latin-1, tracciati che cambiano da una versione all’altra. Il mio lavoro assorbe questo caos una volta sola, in pacchetti Julia open source, così l’analisi può partire dalla domanda invece che dal formato del file. Finora dieci pacchetti coprono registri sanitari, elezioni, statistiche sulla criminalità, la banca centrale, la biodiversità oceanica, la qualità dei dati, i modelli di documento e la gestione di progetti. Scrivo anche ricerca riproducibile: il mio ultimo preprint stima che un anno secco come il 2012/13, un tempo atteso circa ogni 38 anni a Petrolina, ora arrivi circa ogni 12.'
  kw: 'Parole chiave: statistica · Julia · dati pubblici · riproducibilità · semiarido'
  fig_title: Precipitazioni per anno idrologico, Petrolina, dal 1963/64 al 2020/21
  fig_desc: Barre per 47 anni con dati validi. Le precipitazioni diminuiscono di circa 60 mm per decennio. Gli anni più secchi sono il 2011/12, il 2012/13 e il 2016/17, tutti vicini a 150 mm.
  fig_norm: normale 1963–2009 · 549 mm
  fig_trend: tendenza -60 mm / decennio
  nodata: giorni validi insufficienti
  fig_l: "<b>Figura 1</b>"
  fig_c: 'Precipitazioni per anno idrologico alla stazione INMET 82983, Petrolina, 1963/64–2020/21 (47 anni con dati validi; i cerchi vuoti indicano gli anni senza). Tratteggio: la normale ufficiale 1963–2009. Linea continua: una tendenza di Sen–Theil stimata qui sulla stessa serie, −60 mm per decennio; l’articolo riporta −60 [−87; −33]. <span class="pull">Un anno secco è rumore. Sei decenni di anni secchi sono una tendenza.</span>'
  s1h: Pacchetti
  s1l: 'Julia open source, scritto per essere letto: schemi tipizzati, poche dipendenze, Tables.jl ovunque sia possibile.'
  tbl_l: "<b>Tabella 1</b>"
  tbl_c: L’attività è il numero di commit a settimana nelle ultime 52 settimane, da GitHub. Seleziona l’intestazione di una colonna per ordinare.
  th_pkg: Pacchetto
  th_dom: Ambito
  th_ver: Versione
  th_act: Attività, 52 sett.
  th_lnk: Link
  d_microsus: Microdati DATASUS con letture in streaming a memoria costante di .dbc/.dbf e schemi tipizzati per SIM, SINASC, SIH, SIA, CNES e SINAN.
  d_brelections: Dati elettorali del TSE — candidati, voti per seggio, patrimoni, elettorato — senza ZIP da estrarre né Latin-1 da gestire.
  d_electionforensics: Test di Rozenas, di Benford e dell’ultima cifra che misurano il proprio errore di primo tipo sui tuoi dati prima che tu concluda qualcosa.
  d_debrief: Statistiche sulla criminalità del MJSP/Sinesp in un unico schema stabile, nonostante anni di tracciati mutevoli, con tassi per 100 mila abitanti.
  d_bcb: 'API della Banca Centrale del Brasile: serie SGS, tassi di cambio PTAX, aspettative Focus e un generatore generico di query OData.'
  d_obisclient: Un client indipendente per OBIS, l’Ocean Biodiversity Information System (IOC/UNESCO).
  d_missingpatterns: 'Pattern di dati mancanti nel terminale: heatmap, riepiloghi in stile md.pattern() e co-occorrenze, nessuna dipendenza grafica.'
  d_perth: Gantt e Kanban gestiti dal REPL, con un’interfaccia web locale e condivisione in tempo reale sulla rete locale.
  d_kanon: Un linguaggio per modelli di documento i cui modelli dichiarano il proprio contratto sui dati.
  d_liquid: Il linguaggio di template Liquid in Julia puro; il rendering non valuta mai codice Julia.
  dom_health: Salute
  dom_elections: Elezioni
  dom_public_safety: Sicurezza pubblica
  dom_economics: Economia
  dom_biodiversity: Biodiversità
  dom_data_quality: Qualità dei dati
  dom_tools: Strumenti
  l_code: codice
  l_docs: doc
  s2h: Ricerca
  s2l: Ogni numero nel testo è generato dal codice, con test unitari e una verifica indipendente in Python.
  cite_code: codice e dati
  u1: mm / decennio
  u2: "°C / decennio"
  u3: anni
  u4: stazioni
  st1: Tendenza delle precipitazioni annue fino al 2020/21, intervallo al 95% da −87 a −33.
  st2: Temperatura minima. La massima è salita di +0,28 °C per decennio.
  st3: 'Tempo di ritorno di un anno secco come il 2012/13: clima stazionario contro media recente.'
  st4: Analisi regionale di frequenza, verificata con i pluviometri ANA e le normali INMET.
  s3h: Metodi
  s3l: Come lavoro, in quattro regole.
  m1h: <span class="mono">3.1</span>Assorbire il caos una volta sola
  m2h: <span class="mono">3.2</span>Verificare l’ipotesi nulla prima di fidarsene
  m3h: <span class="mono">3.3</span>Ogni numero viene dal codice
  m4h: <span class="mono">3.4</span>Poche dipendenze, superficie ridotta
  m1p: File DBC, Latin-1, tracciati che cambiano da un anno all’altro — gestiti dentro il pacchetto, così nessuno a valle deve farlo.
  m2p: Diverse ipotesi nulle classiche della forensica elettorale non valgono per i conteggi dei voti. Il pacchetto misura il tasso di errore che ottiene davvero sui tuoi dati.
  m3p: 'Gli articoli sono generati, non digitati: figure, tabelle e numeri nel testo escono tutti dalla stessa esecuzione riproducibile.'
  m4p: Heatmap nel terminale senza librerie grafiche; client API senza HTTP.jl. Veloci da caricare, facili da mantenere.
  s4h: Corrispondenza
  s4p: Issue, pull request e domande su qualsiasi pacchetto sono benvenute lì.
  foot: Composto in JetBrains Mono · nessun tracker · <a href="https://github.com/dantebertuzzi/dantebertuzzi.github.io">sorgente</a>
hu:
  title: Dante Bertuzzi — statisztika, Julia, közadatok
  a_lang: Nyelv
  a_theme: Színtéma
  t_auto: auto
  t_paper: papír
  t_night: éjszaka
  a_desert: 'Naplemente a sertão felett: lapos tetejű fennsíkok, a São Francisco folyó és mandacaru kaktuszok'
  k1: Portfólió
  k2: 1. munkaanyag
  k3: 2026. november
  dek: Statisztikus vagyok. Julia-csomagokat írok, amelyek reprodukálhatóvá teszik a brazil közadatokat — és annak a helynek az éghajlatát kutatom, ahol élek.
  abs_l: Összefoglaló
  abs: 'Brazília közadatai gazdagok, de nehezen hozzáférhetők: tömörített DBC-fájlok, Latin-1 kódolás, kiadásról kiadásra változó szerkezet. A munkám ezt a káoszt egyszer, nyílt forráskódú Julia-csomagokban kezeli, így az elemzés a kérdésnél kezdődhet, nem a fájlformátumnál. Eddig tíz csomag fedi le az egészségügyi nyilvántartásokat, a választásokat, a bűnügyi statisztikákat, a központi bankot, az óceáni biodiverzitást, az adatminőséget, a dokumentumsablonokat és a projektmenedzsmentet. Reprodukálható kutatást is végzek: legutóbbi preprintem szerint egy olyan száraz év, mint a 2012/13-as, amely Petrolinában korábban nagyjából 38 évente fordult elő, ma körülbelül 12 évente jön el.'
  kw: 'Kulcsszavak: statisztika · Julia · közadatok · reprodukálhatóság · félszáraz éghajlat'
  fig_title: Csapadék hidrológiai évenként, Petrolina, 1963/64–2020/21
  fig_desc: Oszlopok 47, érvényes adattal rendelkező évre. A csapadék évtizedenként körülbelül 60 mm-rel csökken. A legszárazabb évek a 2011/12-es, a 2012/13-as és a 2016/17-es, mindegyik 150 mm körül.
  fig_norm: normál 1963–2009 · 549 mm
  fig_trend: trend -60 mm / évtized
  nodata: kevés az érvényes nap
  fig_l: "<b>1. ábra</b>"
  fig_c: 'Csapadék hidrológiai évenként az INMET 82983-as állomásán, Petrolina, 1963/64–2020/21 (47 év érvényes adattal; az üres karikák az adat nélküli éveket jelölik). Szaggatott vonal: az 1963–2009-es hivatalos normál érték. Folytonos vonal: ugyanerre a sorra itt illesztett Sen–Theil-trend, évtizedenként −60 mm; a tanulmány −60 [−87; −33] értéket közöl. <span class="pull">Egy száraz év csak zaj. Hat évtizednyi száraz év már trend.</span>'
  s1h: Csomagok
  s1l: 'Nyílt forráskódú Julia, olvasásra írva: típusos sémák, kevés függőség, Tables.jl mindenhol, ahol illik.'
  tbl_l: "<b>1. táblázat</b>"
  tbl_c: Az aktivitás a heti commitok száma az elmúlt 52 hétben, a GitHub adatai alapján. A rendezéshez válassz egy oszlopfejlécet.
