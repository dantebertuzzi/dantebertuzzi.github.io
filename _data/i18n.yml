  d_brelections: A TSE választási adatai — jelöltek, szavazókörönkénti szavazatok, vagyonnyilatkozatok, választópolgárok — kicsomagolandó ZIP-ek és Latin-1 nélkül.
  d_electionforensics: Rozenas-, Benford- és utolsószámjegy-tesztek, amelyek a te adataidon mérik meg saját elsőfajú hibájukat, mielőtt bármire következtetnél.
