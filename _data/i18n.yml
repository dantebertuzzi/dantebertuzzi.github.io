  st2: Minimumhőmérséklet. A maximum évtizedenként +0,28 °C-kal nőtt.
  st3: 'A 2012/13-ashoz hasonlóan száraz év visszatérési ideje: stacionárius éghajlat vs. a közelmúlt átlaga.'
  st4: Regionális gyakoriságelemzés, az ANA csapadékmérőivel és az INMET normál értékeivel ellenőrizve.
  s3h: Módszerek
  s3l: Így dolgozom, négy szabályban.
  m1h: <span class="mono">3.1</span>A káoszt egyszer kell kezelni
  m2h: <span class="mono">3.2</span>Előbb ellenőrizd a nullhipotézist, csak aztán bízz benne
  m3h: <span class="mono">3.3</span>Minden szám kódból származik
  m4h: <span class="mono">3.4</span>Kevés függőség, kis felület
  m1p: DBC-fájlok, Latin-1, évről évre változó szerkezet — mindezt a csomag kezeli, hogy később senkinek se kelljen.
  m2p: Több klasszikus választási-forenzikai nullhipotézis nem teljesül a szavazatszámokra. A csomag megméri, mekkora hibaarányt ad valójában a te adataidon.
  m3p: 'A tanulmányokat generálom, nem begépelem: az ábrák, a táblázatok és a szövegben szereplő számok mind ugyanabból a reprodukálható futtatásból jönnek.'
  m4p: Hőtérképek a terminálban ábrázolókönyvtár nélkül; API-kliensek HTTP.jl nélkül. Gyorsan betöltődnek, könnyű karbantartani őket.
