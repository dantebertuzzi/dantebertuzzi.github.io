pt:
  name: Português
  html_lang: pt-BR
  locale: pt_BR
  url: "/"
  description: Dante Bertuzzi, estatístico em Petrolina (PE). Pacotes Julia de código aberto para dados públicos brasileiros e pesquisa reprodutível sobre o clima do semiárido.
  title: Dante Bertuzzi — estatística, Julia, dados públicos
  a_lang: Idioma
  a_theme: Tema de cores
  t_auto: auto
  t_paper: papel
  t_night: noite
  a_desert: 'Pôr do sol no sertão: chapadas, o rio São Francisco e mandacarus'
  fig_title: Chuva por ano hidrológico, Petrolina, de 1963/64 a 2020/21
  fig_desc: Barras para 47 anos com dados válidos. A chuva cai cerca de 60 mm por década. Os anos mais secos são 2011/12, 2012/13 e 2016/17, todos perto de 150 mm.
  fig_norm: normal 1963–2009 · 549 mm
  fig_trend: tendência -60 mm / década
  nodata: dias válidos insuficientes
  fig_l: "<b>Figura 1</b>"
  fig_c: 'Chuva por ano hidrológico na estação 82983 do INMET, Petrolina, 1963/64–2020/21 (47 anos com dados válidos; círculos vazados marcam os anos sem dados). Tracejado: a normal oficial 1963–2009. Contínuo: uma tendência de Sen–Theil ajustada aqui à mesma série, −60 mm por década; o artigo relata −60 [−87; −33]. <span class="pull">Um ano seco é ruído. Seis décadas deles são tendência.</span>'
  tbl_l: "<b>Tabela 1</b>"
  tbl_c: Atividade é o número de commits por semana nas últimas 52 semanas, segundo o GitHub. Selecione o cabeçalho de uma coluna para ordenar.
  th_pkg: Pacote
  th_dom: Área
  th_ver: Versão
  th_act: Atividade, 52 sem.
  th_lnk: Links
  l_code: código
  l_docs: docs
  foot: Composto em JetBrains Mono · sem rastreadores · <a href="https://github.com/dantebertuzzi/dantebertuzzi.github.io">código-fonte</a>
  domains:
    health: Saúde
    elections: Eleições
    public safety: Segurança pública
    economics: Economia
    biodiversity: Biodiversidade
    data quality: Qualidade de dados
    tools: Ferramentas
  packages:
    microsus: Microdados do DATASUS com leitura em streaming de .dbc/.dbf com memória constante e esquemas tipados para SIM, SINASC, SIH, SIA, CNES e SINAN.
    brelections: Dados eleitorais do TSE — candidatos, votos por seção, bens declarados, eleitorado — sem ZIP para descompactar e sem Latin-1 para tratar.
    electionforensics: Testes de Rozenas, de Benford e do último dígito que medem o próprio erro tipo I nos seus dados antes de você concluir qualquer coisa.
    debrief: Estatísticas criminais do MJSP/Sinesp num esquema único e estável, apesar de anos de layouts diferentes, com taxas por 100 mil habitantes.
    obisclient: Um cliente independente para o OBIS, o Ocean Biodiversity Information System (COI/UNESCO).
    missingpatterns: 'Padrões de dados faltantes no terminal: mapas de calor, resumos no estilo md.pattern() e coocorrência, sem nenhuma dependência gráfica.'
    perth: Gantt e Kanban comandados pelo REPL, com interface web local e compartilhamento em tempo real na rede local.
    kanon: Uma linguagem de modelos de documento cujos modelos declaram o próprio contrato de dados.
    liquid: A linguagem de templates Liquid em Julia puro; a renderização nunca executa código Julia.
en:
  name: English
  html_lang: en
  locale: en_US
  url: "/en/"
  description: Dante Bertuzzi, statistician in Petrolina, Brazil. Open-source Julia packages for Brazilian public data and reproducible research on the climate of the semi-arid.
  title: Dante Bertuzzi — statistics, Julia, public data
  a_lang: Language
  a_theme: Colour theme
  t_auto: auto
  t_paper: paper
  t_night: night
  a_desert: 'Sunset over the sertão: flat-topped hills, the São Francisco river and mandacaru cacti'
  fig_title: Rainfall per hydrological year, Petrolina, 1963/64 to 2020/21
  fig_desc: Bars for 47 years with valid data. Rainfall falls by about 60 mm per decade. The driest years are 2011/12, 2012/13 and 2016/17, all near 150 mm.
  fig_norm: normal 1963–2009 · 549 mm
  fig_trend: trend -60 mm / decade
  nodata: not enough valid days
  fig_l: "<b>Figure 1</b>"
  fig_c: 'Rainfall per hydrological year at INMET station 82983, Petrolina, 1963/64–2020/21 (47 years with valid data; hollow dots mark years without). Dashed: the 1963–2009 official normal. Solid: a Sen–Theil trend fitted here to the same series, −60 mm per decade; the paper reports −60 [−87; −33]. <span class="pull">One dry year is noise. Six decades of them are a trend.</span>'
  tbl_l: "<b>Table 1</b>"
  tbl_c: Activity is commits per week over the last 52 weeks, from GitHub. Select a column header to sort.
  th_pkg: Package
  th_dom: Domain
  th_ver: Version
  th_act: Activity, 52 wk
  th_lnk: Links
  l_code: code
  l_docs: docs
  foot: Set in JetBrains Mono · no trackers · <a href="https://github.com/dantebertuzzi/dantebertuzzi.github.io">source</a>
  domains:
    health: Health
    elections: Elections
    public safety: Public safety
    economics: Economics
    biodiversity: Biodiversity
    data quality: Data quality
    tools: Tools
  packages:
    microsus: DATASUS microdata with constant-memory streaming reads of .dbc/.dbf and typed schemas for SIM, SINASC, SIH, SIA, CNES and SINAN.
    brelections: TSE electoral data — candidates, votes by polling station, assets, electorate — with no ZIPs to unpack and no Latin-1 to deal with.
    electionforensics: Rozenas, Benford and last-digit tests that measure their own type I error on your data before you conclude anything.
    debrief: Crime statistics from MJSP/Sinesp under one stable schema across years of shifting layouts, with per-100k rates.
    obisclient: An independent client for OBIS, the Ocean Biodiversity Information System (IOC/UNESCO).
    missingpatterns: 'Missing-data patterns in the terminal: heatmaps, md.pattern()-style summaries and co-occurrence, zero plotting dependencies.'
    perth: Gantt and Kanban driven from the REPL, with a local web UI and real-time sharing over the LAN.
    kanon: A document template language whose templates declare their own data contract.
    liquid: The Liquid template language in pure Julia; rendering never evaluates Julia code.
