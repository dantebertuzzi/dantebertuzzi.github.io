# Site
title: Dante Bertuzzi
tagline: estatística, Julia, dados públicos
description: >-
  Dante Bertuzzi, estatístico em Petrolina (PE). Pacotes Julia de código aberto
  para dados públicos brasileiros e pesquisa reprodutível sobre o clima do semiárido.
url: https://dantebertuzzi.github.io
baseurl: ""
lang: pt-BR
author:
  name: Dante Bertuzzi
  short: D. Bertuzzi
  place: Petrolina, PE
  coords: 9°23′S 40°30′W
github: https://github.com/dantebertuzzi
repository: https://github.com/dantebertuzzi/dantebertuzzi.github.io

# Idiomas do seletor (o português é o idioma do conteúdo)
languages:
  - { code: pt, name: Português }
  - { code: en, name: English }
  - { code: it, name: Italiano }
  - { code: hu, name: Magyar }
  - { code: ro, name: Română }

# Temas de cor (key = nome interno, label = texto no botão)
themes:
  - { key: auto, label: auto }
  - { key: paper, label: papel }
  - { key: night, label: noite }
  - { key: caatinga, label: caatinga }

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .editorconfig
