# Site
title: Dante Bertuzzi
url: https://dantebertuzzi.github.io
baseurl: ""
author:
  name: Dante Bertuzzi
  short: D. Bertuzzi
  place: Petrolina, PE
  coords: 9°23′S 40°30′W
github: https://github.com/dantebertuzzi
repository: https://github.com/dantebertuzzi/dantebertuzzi.github.io

# Idiomas: os textos de interface ficam em _data/i18n.yml (a ordem lá define a
# ordem das bandeiras); o conteúdo de cada idioma é uma página (index.md, en/index.md...).
default_lang: pt

# Temas de cor (os rótulos vêm de _data/i18n.yml: t_auto, t_paper, t_night)
themes: [auto, paper, night, caatinga]

defaults:
  - scope: { path: "" }
    values:
      layout: default
      lang: pt

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - .editorconfig
